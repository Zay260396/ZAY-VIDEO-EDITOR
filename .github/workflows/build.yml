name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buka zip proyek
        run: |
          unzip -qo "$(ls -v ZAY-Project*.zip | tail -n 1)"
      - name: Catat versi
        run: |
          grep -m1 versionName ZayVideoEditor/app/build.gradle.kts >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Terima lisensi SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        run: |
          gradle assembleDebug --stacktrace
        working-directory: ZayVideoEditor
      - uses: actions/upload-artifact@v4
        with:
          name: ZAY-Video-Editor-debug-apk
          path: ZayVideoEditor/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
