name: Build ZAY VIDEO EDITOR APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Check project files
    run: |
      echo "Checking Android project..."
      ls -la
      if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
        echo "Android project is incomplete: settings.gradle is missing."
        exit 1
      fi
      if [ ! -f gradlew ]; then
        echo "Android project is incomplete: gradlew is missing."
        exit 1
      fi

  - name: Build APK
    run: |
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: ZAY-VIDEO-EDITOR-APK
      path: app/build/outputs/apk/debug/*.apk
